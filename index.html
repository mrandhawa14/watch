<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Watch</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0b0b0d;
      color: #f2f2f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
      gap: 18px;
    }
    h1 {
      font-size: clamp(20px, 5vw, 30px);
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .stage {
      width: 100%;
      max-width: 1100px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
      aspect-ratio: 16 / 9;
      display: flex;
    }
    video { width: 100%; height: 100%; background: #000; display: block; }
    .msg {
      max-width: 620px;
      text-align: center;
      line-height: 1.5;
      color: #8e8e93;
      font-size: 15px;
      padding: 0 8px;
    }
    .msg code {
      background: #1c1c1e;
      padding: 2px 7px;
      border-radius: 6px;
      color: #d1d1d6;
      font-size: 13px;
      word-break: break-all;
    }
    /* Passphrase gate */
    .gate {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    .gate input {
      width: 100%;
      padding: 14px 16px;
      font-size: 17px;
      border-radius: 12px;
      border: 1px solid #2c2c2e;
      background: #1c1c1e;
      color: #fff;
      text-align: center;
      outline: none;
    }
    .gate input:focus { border-color: #5856d6; }
    .gate button {
      padding: 14px 16px;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: #5856d6;
      color: #fff;
      cursor: pointer;
    }
    .gate button:active { opacity: .8; }
    .gate .err { color: #ff453a; font-size: 14px; min-height: 18px; }
    .hidden { display: none !important; }
    footer { color: #48484a; font-size: 12px; }
  </style>
</head>
<body>
  <h1 id="title">Watch</h1>

  <!-- Passphrase gate (only shown if config.passphrase is set) -->
  <div id="gate" class="gate hidden">
    <div class="msg">Enter the word to watch.</div>
    <input id="pass" type="password" inputmode="text" autocomplete="off" placeholder="password" />
    <div class="err" id="err"></div>
    <button id="unlock">Watch</button>
  </div>

  <!-- Player -->
  <div id="player" class="stage hidden">
    <video id="video" controls playsinline preload="metadata"></video>
  </div>

  <!-- Empty / not-configured message -->
  <div id="empty" class="msg hidden">
    No video is set yet. Run <code>./add-video.sh /path/to/video.mp4</code> to publish one.
  </div>

  <footer>Streaming — nothing is downloaded to your device.</footer>

  <script src="config.js"></script>
  <script>
    (function () {
      var cfg = window.STREAM_CONFIG || {};
      var titleEl = document.getElementById('title');
      var player  = document.getElementById('player');
      var video   = document.getElementById('video');
      var empty   = document.getElementById('empty');
      var gate    = document.getElementById('gate');

      document.title = cfg.title || 'Watch';
      titleEl.textContent = cfg.title || 'Watch';

      function show(el) { el.classList.remove('hidden'); }
      function hide(el) { el.classList.add('hidden'); }

      function startPlayer() {
        if (!cfg.videoUrl) { show(empty); return; }
        if (cfg.poster) video.setAttribute('poster', cfg.poster);
        video.src = cfg.videoUrl;
        show(player);
      }

      var need = (cfg.passphrase || '').trim();
      if (need) {
        show(gate);
        var pass = document.getElementById('pass');
        var err  = document.getElementById('err');
        var btn  = document.getElementById('unlock');
        function tryUnlock() {
          if (pass.value.trim() === need) {
            hide(gate);
            startPlayer();
          } else {
            err.textContent = 'Wrong word — try again.';
          }
        }
        btn.addEventListener('click', tryUnlock);
        pass.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });
        pass.focus();
      } else {
        startPlayer();
      }
    })();
  </script>
</body>
</html>
