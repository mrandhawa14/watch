  { binding = "LOGS", id = "fe0ddbb45d4b40d1b0799e9d8f0ad007" }
]

[vars]
# Secret used to view the log at  /log?key=...  — change it if you like.
VIEW_SECRET = "vlog_7Kq2mZ9pR4xN8tB"
